<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF6FA">
<title>Kotak rahasia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
:root{--p:#DB2777;--ps:#F472B6;--sf:#FFF6FA;--fg:#7A1E4A;--mu:#A6577D;--bd:#FBCFE8;--glass:rgba(255,255,255,.58);--gb:rgba(255,255,255,.75);--sh:0 20px 60px -24px rgba(122,30,74,.28);--ex:cubic-bezier(.16,1,.3,1);--sc:'Great Vibes',cursive;color-scheme:light}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:var(--fg);background:var(--sf);font:500 18px/1.6 'Cormorant Garamond',Georgia,serif;overflow-x:hidden;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(circle at 12% 0,#FFD9EA 0,transparent 42%),radial-gradient(circle at 92% 88%,#FFC9E1 0,transparent 40%)}
a{color:inherit;text-decoration:none}a,button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}button{font:inherit}
:focus-visible{outline:2px solid var(--p);outline-offset:3px;border-radius:6px}
#app{position:relative;z-index:1}
#pt{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#pt i{position:absolute;top:-30px;height:18px;background:linear-gradient(135deg,var(--ps),var(--p));border-radius:0 100% 0 100%;opacity:.55;animation:fall linear infinite}
@keyframes fall{to{transform:translate3d(var(--dx),112vh,0) rotate(540deg)}}
.wrap{max-width:1060px;margin:0 auto;padding:0 max(20px,env(safe-area-inset-right)) 0 max(20px,env(safe-area-inset-left))}
.box{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);border:1px solid var(--gb);border-radius:28px;box-shadow:var(--sh)}
.dock{position:fixed;z-index:20;top:14px;left:50%;transform:translateX(-50%);width:min(94%,720px);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px 8px 22px;border-radius:99px;background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--gb);box-shadow:var(--sh)}
.logo{font:400 1.9rem/1 var(--sc);color:var(--p)}
.pill{display:inline-block;padding:6px 16px;min-height:40px;border:1px solid transparent;border-radius:99px;background:transparent;color:var(--fg);font-weight:600;cursor:pointer;transition:background .3s var(--ex),color .3s}
.pill:hover{background:#fff;border-color:var(--bd)}.pill.solid{background:var(--p);color:#fff}.pill.solid:hover{background:var(--fg)}
.hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:110px 0 70px}
.hero>div:first-child{display:flex;flex-direction:column;align-items:center}
.ico{display:block;width:96px;margin-bottom:12px;filter:drop-shadow(0 14px 22px rgba(219,39,119,.28));animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-3deg)}}
.eyebrow{margin:0 0 4px;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--p);font-weight:700}
h1{margin:0;font:400 clamp(3.4rem,14vw,7rem)/1 var(--sc);color:var(--p)}
.sub{max-width:30rem;margin:8px auto 20px;font-style:italic;font-size:1.3rem;color:var(--mu)}
.strip{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:0 0 30px;padding:0;list-style:none}
.strip li{padding:2px 14px;border:1px solid var(--bd);border-radius:99px;background:#fffa;font-size:.95rem;font-weight:600;color:var(--mu)}
.badge{width:100%;max-width:380px;padding:26px 22px 18px;text-align:left}
.lbl{display:block;margin:0 0 8px;font-weight:700;font-size:.8rem;letter-spacing:.2em;text-transform:uppercase;color:var(--p)}
.hint{margin:0 0 8px;font-size:.98rem;color:var(--mu)}
input,textarea{width:100%;margin:0 0 12px;padding:12px 16px;border:1px solid var(--bd);border-radius:16px;background:#ffffffb8;color:var(--fg);font:inherit;font-weight:600;transition:border-color .3s,box-shadow .3s}
textarea{min-height:130px;resize:vertical}
input:focus,textarea:focus{outline:0;border-color:var(--p);box-shadow:0 0 0 4px #db277722}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:11px 28px;min-height:48px;border:0;border-radius:99px;background:var(--p);color:#fff;font-weight:700;letter-spacing:.02em;cursor:pointer;box-shadow:0 10px 30px -8px rgba(219,39,119,.55);transition:transform .3s var(--ex),box-shadow .3s var(--ex)}
.btn:hover{transform:translateY(-3px);box-shadow:0 16px 36px -6px rgba(219,39,119,.6)}.btn:active{transform:scale(.98)}
.btn.alt{background:#fff;color:var(--p);border:1px solid var(--bd);box-shadow:none}.btn:disabled{opacity:.55;cursor:wait}
.msg{min-height:1.5em;margin:10px 0 0;font-weight:700;font-size:1rem;color:#b3202f}.msg.ok{color:#0b7a63}
.pg{padding:120px 0 80px;max-width:720px}
.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:40px 0 20px;padding-bottom:8px;border-bottom:1px solid var(--bd)}
h2{margin:0;font:400 clamp(2rem,6vw,2.8rem)/1.1 var(--sc)}
.name{margin:0;font:400 clamp(3rem,13vw,5.4rem)/1.05 var(--sc);color:var(--p);word-break:break-all}
.tag{display:inline-block;padding:0 12px;border:1px solid var(--bd);border-radius:99px;background:#fff;font-size:.8rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--p)}
.tag.s{background:var(--bd)}.tag.i{background:var(--p);border-color:var(--p);color:#fff}.tag.p{background:var(--fg);border-color:var(--fg);color:#fff}
.compose,.cp,.note{padding:22px 24px;margin-bottom:22px}
.cp.priv{background:#FFF0F6;border-style:dashed;border-color:var(--ps)}
.cprow{display:flex;gap:10px;align-items:flex-start}.cprow input{margin:0;font-size:.95rem}.cprow .btn{flex:none}
.cnt{font-size:.95rem;font-weight:700;color:var(--mu)}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.note{font-style:italic;color:var(--mu)}
.mc{padding:20px 24px;margin-bottom:18px;animation:rise .7s var(--ex) both}
.mc:nth-child(2){animation-delay:.05s}.mc:nth-child(3){animation-delay:.1s}.mc:nth-child(4){animation-delay:.15s}.mc:nth-child(n+5){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
time{font-size:.9rem;color:var(--mu)}
.body{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:1.22rem;color:#5B2740}
.reply{margin-top:14px;padding:12px 18px;border-radius:18px;background:#FFF0F6;border-left:3px solid var(--p)}.reply .body{margin:6px 0 4px}
.rf{margin-top:14px}.rf textarea{min-height:84px}.acts{display:flex;gap:6px;margin-top:10px}.foot{margin-top:40px;display:flex;justify-content:center}
/* amplop terbuka (pemilik kotak) */
.ov{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:56px;padding:20px;background:rgba(122,30,74,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);animation:fin .4s ease both}
.ov.out{animation:fout .45s ease both}@keyframes fin{from{opacity:0}}@keyframes fout{to{opacity:0}}
.env{position:relative;width:min(300px,78vw);aspect-ratio:3/2;margin-top:120px;animation:drop .8s var(--ex) both}
@keyframes drop{from{opacity:0;transform:translateY(70px) scale(.85)}}
.env i{position:absolute;display:block}
.eb{inset:0;background:#F9A8D4;border-radius:10px;box-shadow:0 30px 60px -20px rgba(0,0,0,.45)}
.ef{inset:0;z-index:2;border-radius:10px;background:linear-gradient(160deg,#F472B6,#DB2777);clip-path:polygon(0 0,50% 54%,100% 0,100% 100%,0 100%)}
.fp{left:0;top:0;width:100%;height:54%;background:linear-gradient(#E85A9F,#DB2777);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;z-index:3;animation:flap .7s .7s var(--ex) both}
@keyframes flap{0%{transform:perspective(800px) rotateX(0);z-index:3}49%{z-index:3}50%{z-index:0}100%{transform:perspective(800px) rotateX(180deg);z-index:0;background:#F9A8D4}}
.paper{position:absolute;left:7%;right:7%;top:8px;height:92%;z-index:1;padding:16px 18px;border-radius:8px;background:#fff;box-shadow:0 -6px 24px -8px rgba(122,30,74,.3);overflow:hidden;animation:out 1s 1.25s var(--ex) both}
@keyframes out{to{transform:translateY(-62%);height:118%}}
.paper .body{margin-top:8px;font-size:1.1rem;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.ov .btn{opacity:0;animation:fin .6s 2.1s ease both}
/* pesawat kertas (pengirim) */
.plane{position:fixed;z-index:100;width:48px;height:48px;pointer-events:none;filter:drop-shadow(0 8px 10px rgba(122,30,74,.3))}.plane svg{width:100%;height:100%;display:block}
@media(max-width:560px){
.dock{top:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:calc(100% - 24px);padding:6px}
.logo{display:none}.dock .pill{flex:1;text-align:center;min-height:44px}
.hero{padding:calc(40px + env(safe-area-inset-top,0px)) 0 110px}.pg{padding:calc(28px + env(safe-area-inset-top,0px)) 0 120px}
.cprow{flex-direction:column}.cprow input{width:100%}.compose,.cp,.note,.mc{padding:18px}
}
@media(hover:none){.btn:hover{transform:none}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}#pt{display:none}}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ===== ISI PUNYAMU (Supabase > Project Settings > API) =====
const SUPABASE_URL = "https://gwgdznwsutrsbjvkssgw.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_DOH3hq2LmOnm29usf2mBJA_rKp_QjrR";
// ===========================================================

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $app = document.getElementById("app");
const USER_RE = /^[a-z0-9_]{3,20}$/;
const rand = n => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => b.toString(16).padStart(2, "0")).join("");
const LS = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch {} },
  del(k){ try { localStorage.removeItem(k); } catch {} }
};
const SENDER = LS.get("sk_sender") || rand(16);   // token anonim pengirim, hanya di browser ini
LS.set("sk_sender", SENDER);
const keys = () => { try { return JSON.parse(LS.get("sk_keys") || "{}"); } catch { return {}; } };
const saveKey = (u,k) => { const m = keys(); m[u] = k; LS.set("sk_keys", JSON.stringify(m)); LS.set("sk_me", u); };
const base = () => location.origin + location.pathname;
const shareUrl = u => base() + "?u=" + u;
const fmt = d => new Date(d).toLocaleString("id-ID", { dateStyle: "medium", timeStyle: "short" });

function el(tag, attrs = {}, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)){
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e[k] = v;
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  e.append(...kids.flat().filter(x => x != null && x !== false));
  return e;
}
const show = (...n) => $app.replaceChildren(...n);
const page = (...k) => el("main", { class: "wrap pg" }, ...k);
const say = (e,t,ok) => { e.textContent = t; e.className = "msg" + (ok ? " ok" : ""); };
const dock = () => el("header", { class: "dock" },
  el("a", { class: "logo", href: "./" }, "kotak rahasia"),
  el("a", { class: "pill solid", href: "./?new=1" }, "Buat kotak"));


const svg = (h, c) => { const s = el("span", { class: c }); s.innerHTML = h; return s; };
const ENV = '<svg viewBox="0 0 96 72"><rect x="3" y="6" width="90" height="62" rx="10" fill="#FBCFE8"/><path d="M3 16 48 44 93 16V58a10 10 0 0 1-10 10H13A10 10 0 0 1 3 58z" fill="#F472B6"/><path d="M3 14a10 10 0 0 1 10-8h70a10 10 0 0 1 10 8L48 42z" fill="#DB2777"/><path d="M48 33c-6-5-10-8-10-12a5 5 0 0 1 10-1 5 5 0 0 1 10 1c0 4-4 7-10 12z" fill="#fff"/></svg>';
const PLANE = '<svg viewBox="0 0 64 64"><path d="M4 30 60 6 44 58 31 38z" fill="#fff" stroke="#DB2777" stroke-width="3" stroke-linejoin="round"/><path d="M60 6 31 38 28 54 38 41" fill="#FBCFE8" stroke="#DB2777" stroke-width="3" stroke-linejoin="round"/></svg>';
const calm = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

(() => { const l = el("div", { id: "pt", "aria-hidden": "true" });
  for (let i = 0; i < 14; i++){ const p = el("i");
    p.style.cssText = `left:${Math.random()*100}%;width:${10+Math.random()*9}px;--dx:${Math.random()*120-60}px;animation-duration:${9+Math.random()*9}s;animation-delay:-${Math.random()*14}s`; l.append(p); }
  document.body.prepend(l); })();

// pengirim: pesawat kertas meluncur sampai hilang dari layar
function flyPlane(from){
  if (calm()) return;
  const r = from.getBoundingClientRect(), x = r.left + r.width/2 - 24, y = r.top + r.height/2 - 24;
  const p = svg(PLANE, "plane"); p.style.cssText = `left:${x}px;top:${y}px`; document.body.append(p);
  const W = innerWidth + 160, H = -(y + 160);
  p.animate([
    { transform: "translate(0,0) rotate(-8deg) scale(1)", opacity: 1 },
    { transform: `translate(${W*.3}px,${H*.1+34}px) rotate(-24deg) scale(.9)`, opacity: 1, offset: .3 },
    { transform: `translate(${W*.68}px,${H*.55}px) rotate(-34deg) scale(.5)`, opacity: .9, offset: .65 },
    { transform: `translate(${W}px,${H}px) rotate(-40deg) scale(.08)`, opacity: 0 }
  ], { duration: 2200, easing: "cubic-bezier(.45,.05,.55,.95)" }).onfinish = () => p.remove();
}

// penerima (pemilik kotak): amplop terbuka tiap ada pesan baru
function openEnvelope(m, n){
  const ov = el("div", { class: "ov", role: "dialog", "aria-label": "Pesan baru" });
  const esc = e => { if (e.key === "Escape") close(); };
  const close = () => { document.removeEventListener("keydown", esc); ov.classList.add("out"); setTimeout(() => ov.remove(), 450); };
  const b = el("button", { class: "btn", type: "button", onclick: close }, "Baca");
  ov.append(el("div", { class: "env" }, el("i", { class: "eb" }),
    el("div", { class: "paper" }, el("span", { class: "tag i" }, n > 1 ? n + " pesan baru" : "Pesan baru"), el("p", { class: "body" }, m.body)),
    el("i", { class: "ef" }), el("i", { class: "fp" })), b);
  ov.onclick = e => { if (e.target === ov) close(); };
  document.addEventListener("keydown", esc);
  document.body.append(ov); b.focus({ preventScroll: true });
}
let POLL;
function watch(name, key, mx){
  POLL = setInterval(async () => {
    if (document.hidden || [...$app.querySelectorAll("textarea")].some(t => t.value.trim())) return;
    const { data } = await sb.rpc("get_thread", { p_username: name, p_sender: SENDER, p_key: key });
    if (data && data.owner && data.messages.some(m => +m.id > mx)) threadPage(name);
  }, 12000);
}

function copyRow(label, value, note, cls = ""){
  const i = el("input", { readonly: "readonly", value, "aria-label": label });
  const b = el("button", { class: "btn alt", type: "button" }, "Salin");
  b.onclick = async () => {
    try { await navigator.clipboard.writeText(value); b.textContent = "Tersalin"; setTimeout(() => b.textContent = "Salin", 1600); }
    catch { i.select(); }
  };
  return el("div", { class: "box cp " + cls }, el("span", { class: "lbl" }, label), note && el("p", { class: "hint" }, note), el("div", { class: "cprow" }, i, b));
}

/* ---------- Beranda: buat kotak cukup dengan username ---------- */
function homePage(){
  const inp = el("input", { id: "u", maxlength: "20", placeholder: "username", autocapitalize: "off", autocomplete: "off", spellcheck: "false" });
  const st = el("p", { class: "msg", role: "status" });
  const go = el("button", { class: "btn", type: "button" }, "Buat kotak");
  const submit = async () => {
    const u = inp.value.trim().toLowerCase();
    if (!USER_RE.test(u)) return say(st, "Username 3–20 karakter: huruf kecil, angka, atau _.");
    go.disabled = true;
    const key = rand(24);
    const { error } = await sb.rpc("create_box", { p_username: u, p_key: key });
    go.disabled = false;
    if (error) return say(st, error.code === "23505" ? "Username itu sudah dipakai. Coba yang lain." : "Gagal membuat kotak: " + (error.message || error.code || "tidak diketahui"));
    saveKey(u, key);
    history.replaceState(null, "", shareUrl(u));
    threadPage(u);
  };
  go.onclick = submit;
  inp.onkeydown = e => { if (e.key === "Enter") submit(); };
  show(dock(), el("div", { class: "wrap hero" },
    el("div", {},
      svg(ENV, "ico"), el("p", { class: "eyebrow" }, "Kotak pesan anonim"), el("h1", {}, "Pesan tanpa nama."),
      el("p", { class: "sub" }, "Satu tautan, siapa saja bisa menulis. Cuma kamu yang bisa membalas."),
      el("ul", { class: "strip" }, el("li", {}, "Tanpa login"), el("li", {}, "Tanpa email"), el("li", {}, "Gratis"))),
    el("div", { class: "box badge" }, el("label", { class: "lbl", for: "u" }, "Pilih username"), inp, go, st)));
}

/* ---------- Kartu pesan ---------- */
function replyForm(m, name, key, existing){
  const ta = el("textarea", { maxlength: "500", placeholder: "Tulis balasan. Semua pengunjung bisa membacanya.", "aria-label": "Balasan" });
  ta.value = existing || "";
  const st = el("p", { class: "msg", role: "status" });
  const b = el("button", { class: "btn", type: "button" }, existing ? "Simpan balasan" : "Balas");
  b.onclick = async () => {
    const t = ta.value.trim();
    if (!t) return say(st, "Balasan masih kosong.");
    b.disabled = true;
    const { error } = await sb.rpc("reply_message", { p_username: name, p_key: key, p_id: m.id, p_reply: t });
    b.disabled = false;
    if (error) return say(st, "Balasan gagal dikirim. Coba lagi.");
    threadPage(name);
  };
  return el("div", { class: "rf" }, ta, b, st);
}

function card(m, name, owner, key){
  const c = el("article", { class: "box mc" },
    el("div", { class: "meta" }, el("span", { class: "tag" + (m.mine ? " s" : "") }, m.mine ? "Pesanmu" : "Anonim"), el("time", {}, fmt(m.created_at))),
    el("p", { class: "body" }, m.body));
  if (m.reply) c.append(el("div", { class: "reply" },
    el("span", { class: "tag i" }, "Balasan @" + name), el("p", { class: "body" }, m.reply), el("time", {}, fmt(m.replied_at))));
  if (owner){
    const slot = el("div"), acts = el("div", { class: "acts" });
    if (m.reply){
      const ed = el("button", { class: "pill", type: "button" }, "Ubah balasan");
      ed.onclick = () => { ed.remove(); slot.append(replyForm(m, name, key, m.reply)); };
      acts.append(ed);
    } else slot.append(replyForm(m, name, key, ""));
    const del = el("button", { class: "pill", type: "button" }, "Hapus pesan");
    del.onclick = async () => {
      if (!confirm("Hapus pesan ini beserta balasannya?")) return;
      const { error } = await sb.rpc("delete_message", { p_username: name, p_key: key, p_id: m.id });
      if (!error) threadPage(name);
    };
    acts.append(del);
    c.append(slot, acts);
  }
  return c;
}

/* ---------- Tampilan pengunjung ---------- */
function visitorView(name, data){
  const ta = el("textarea", { maxlength: "500", placeholder: "Tulis pesanmu di sini. Namamu tidak akan terlihat.", "aria-label": "Pesan" });
  const cnt = el("span", { class: "cnt" }, "0/500");
  ta.oninput = () => cnt.textContent = ta.value.length + "/500";
  const st = el("p", { class: "msg", role: "status" });
  const btn = el("button", { class: "btn", type: "button" }, "Kirim pesan");
  btn.onclick = async () => {
    const t = ta.value.trim();
    if (!t) return say(st, "Pesan masih kosong. Tulis sesuatu dulu.");
    btn.disabled = true;
    const { error } = await sb.rpc("send_message", { p_username: name, p_sender: SENDER, p_body: t });
    btn.disabled = false;
    if (error) return say(st, (error.message || "").includes("rate_limited") ? "Terlalu cepat. Tunggu semenit lalu kirim lagi." : "Pesan gagal terkirim. Coba lagi.");
    flyPlane(btn); ta.value = ""; ta.style.cssText = "opacity:0;transform:translateY(-12px) scale(.97);transition:.5s";
    setTimeout(() => threadPage(name), 900);
  };
  const thread = data.can_view
    ? [el("div", { class: "sh" }, el("h2", {}, "Pesan di kotak ini"), el("button", { class: "pill", type: "button", onclick: () => threadPage(name) }, "Muat ulang")),
       ...(data.messages.length ? data.messages.map(m => card(m, name, false, null)) : [el("p", {}, "Belum ada pesan.")])]
    : [el("div", { class: "box note" }, "Kirim satu pesan dulu untuk membaca pesan lain di kotak ini.")];
  show(dock(), page(
    el("p", { class: "lbl" }, "Kirim pesan anonim ke"),
    el("h1", { class: "name" }, "@" + name),
    el("div", { class: "box compose", style: "margin-top:22px" }, ta, el("div", { class: "bar" }, cnt, btn), st),
    ...thread));
}

/* ---------- Tampilan pemilik ---------- */
function ownerView(name, key, data){
  const forget = el("button", { class: "pill", type: "button" }, "Keluar dari kotak ini");
  forget.onclick = () => {
    if (!confirm("Hapus kunci dari browser ini? Tanpa tautan pribadi, kamu tidak bisa membalas lagi dari sini.")) return;
    const m = keys(); delete m[name]; LS.set("sk_keys", JSON.stringify(m));
    if (LS.get("sk_me") === name) LS.del("sk_me");
    threadPage(name);
  };
  show(dock(), page(
    el("span", { class: "tag p" }, "Kotakmu"),
    el("h1", { class: "name", style: "margin-top:8px" }, "@" + name),
    el("div", { style: "margin-top:24px" },
      copyRow("Tautan untuk dibagikan", shareUrl(name), "Tempel di bio atau status. Siapa saja bisa mengirim pesan lewat tautan ini."),
      copyRow("Tautan pribadi", shareUrl(name) + "#k=" + key, "Jangan dibagikan. Buka tautan ini di HP atau laptop lain agar bisa membalas dari sana. Simpan juga kalau-kalau data browser terhapus.", "priv")),
    el("div", { class: "sh" }, el("h2", {}, "Pesan masuk (" + data.messages.length + ")"), el("button", { class: "pill", type: "button", onclick: () => threadPage(name) }, "Muat ulang")),
    ...(data.messages.length ? data.messages.map(m => card(m, name, true, key)) : [el("div", { class: "box note" }, "Belum ada pesan. Bagikan tautanmu dulu.")]),
    el("div", { class: "foot" }, forget)));
}

async function threadPage(name){
  clearInterval(POLL);
  if (!$app.firstChild) show(dock(), page(el("p", {}, "Memuat…")));
  const key = keys()[name] || null;
  const { data, error } = await sb.rpc("get_thread", { p_username: name, p_sender: SENDER, p_key: key });
  if (error) return show(dock(), page(el("div", { class: "box note" }, "Gagal memuat. Cek koneksi lalu muat ulang halaman.")));
  if (!data.exists) return show(dock(), page(
    el("div", { class: "box note" }, el("h2", {}, "Kotak tidak ditemukan"), el("p", {}, "Belum ada kotak bernama @" + name + "."),
      el("a", { class: "btn", href: "./?new=1" }, "Buat kotak"))));
  if (!data.owner) return visitorView(name, data);
  const mx = Math.max(0, ...data.messages.map(m => +m.id)), seen = +(LS.get("sk_seen_" + name) || 0);
  const fresh = data.messages.filter(m => +m.id > seen);
  LS.set("sk_seen_" + name, String(Math.max(mx, seen)));
  ownerView(name, key, data);
  if (fresh.length) openEnvelope(fresh[0], fresh.length);
  watch(name, key, mx);
}

function route(){
  const q = new URLSearchParams(location.search);
  let u = (q.get("u") || "").toLowerCase();
  const hk = new URLSearchParams(location.hash.slice(1)).get("k");
  if (q.has("new")) return homePage();
  if (u && hk){ saveKey(u, hk); history.replaceState(null, "", shareUrl(u)); }   // tautan pribadi: simpan kunci lalu bersihkan URL
  if (!u){ const me = LS.get("sk_me"); if (me && keys()[me]){ u = me; history.replaceState(null, "", shareUrl(u)); } }
  u ? threadPage(u) : homePage();
}
route();
</script>
