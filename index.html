<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5eedd">
<title>Kotak rahasia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&display=swap" rel="stylesheet">
<style>
:root{--paper:#f5eedd;--ink:#17141f;--card:#fffdf6;--sun:#ffc933;--iris:#6c4dff;--pine:#0b7a63;--coral:#ff6b57;--sunS:#fff1bd;--irisS:#e5deff;--pineS:#cfeee4;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1rem/1.65 Archivo,system-ui,sans-serif;overflow-x:hidden;-webkit-text-size-adjust:100%}
a{color:inherit}a,button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--iris);outline-offset:3px}
.wrap{max-width:1060px;margin:0 auto;padding:0 max(20px,env(safe-area-inset-right)) 0 max(20px,env(safe-area-inset-left))}
.box{background:var(--card);border:3px solid var(--ink);border-radius:20px;box-shadow:6px 6px 0 var(--ink)}
/* dock */
.dock{position:fixed;z-index:20;top:12px;left:50%;transform:translateX(-50%);width:min(94%,740px);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 8px 6px 18px;background:var(--card);border:3px solid var(--ink);border-radius:99px;box-shadow:4px 4px 0 var(--ink)}
.logo{font:900 1rem/1 Archivo,sans-serif;font-stretch:112%;letter-spacing:-.03em;text-decoration:none}
.pill{display:inline-block;padding:6px 14px;border:2px solid transparent;border-radius:99px;background:transparent;color:var(--ink);font:700 .9rem/1.3 Archivo,sans-serif;font-stretch:87%;text-decoration:none;cursor:pointer}
.pill:hover{background:var(--sun);border-color:var(--ink)}
.pill.solid{background:var(--ink);color:var(--paper)}.pill.solid:hover{background:var(--coral);color:var(--ink)}
/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:48px;align-items:center;padding:128px 0 76px}
h1{margin:0 0 14px;font:900 clamp(2.6rem,10.5vw,5.6rem)/.95 Archivo,sans-serif;font-stretch:125%;letter-spacing:-.04em}
h1 span{display:block;width:max-content;max-width:100%;margin-bottom:12px;padding:.04em .2em .1em;border:3px solid var(--ink);border-radius:14px;box-shadow:5px 5px 0 var(--ink)}
h1 span:nth-child(1){background:var(--sun);transform:rotate(-1.5deg)}
h1 span:nth-child(2){background:var(--coral);transform:rotate(1deg);margin-left:6vw}
h1 span:nth-child(3){background:var(--iris);color:#fff;transform:rotate(-.5deg)}
.sub{max-width:30rem;margin:6px 0 26px;font:italic 800 clamp(1.2rem,3.4vw,1.8rem)/1.25 Archivo,sans-serif;letter-spacing:-.03em}
.strip{display:flex;width:max-content;max-width:100%;margin:0;padding:0;list-style:none;overflow:hidden;border:3px solid var(--ink);border-radius:12px;background:var(--card)}
.strip li{padding:5px 14px;border-right:3px solid var(--ink);font:700 .9rem/1.6 Archivo,sans-serif;font-stretch:87%}
.strip li:last-child{border:0}.strip li:nth-child(1){background:var(--sun)}.strip li:nth-child(2){background:var(--pine);color:#fff}
.badge{position:relative;justify-self:center;width:100%;max-width:300px;padding:36px 18px 18px;transform:rotate(-3deg)}
.badge::before{content:"";position:absolute;top:12px;left:50%;width:54px;height:14px;margin-left:-27px;border:3px solid var(--ink);border-radius:99px;background:var(--paper)}
/* form bits */
.lbl{display:block;margin:0 0 8px;font:700 1rem/1.3 Archivo,sans-serif;font-stretch:87%}
.hint{margin:0 0 8px;font-size:.92rem}
input,textarea{width:100%;margin:0 0 12px;padding:11px 14px;border:3px solid var(--ink);border-radius:12px;background:var(--card);color:var(--ink);font:600 1rem/1.5 Archivo,sans-serif;box-shadow:3px 3px 0 var(--ink)}
textarea{min-height:130px;resize:vertical}
input:focus,textarea:focus{outline:3px solid var(--iris);outline-offset:2px}
.btn{display:inline-block;padding:10px 20px;border:3px solid var(--ink);border-radius:12px;background:var(--sun);color:var(--ink);font:800 1rem/1.3 Archivo,sans-serif;text-decoration:none;cursor:pointer;box-shadow:4px 4px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.btn.alt{background:var(--card)}.btn:disabled{opacity:.55;cursor:wait}
.msg{min-height:1.5em;margin:10px 0 0;font-weight:700;font-size:.95rem;color:#b3202f}.msg.ok{color:var(--pine)}
/* pages */
.pg{padding:112px 0 72px;max-width:760px}
.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:36px 0 22px;padding-bottom:10px;border-bottom:3px solid var(--ink)}
h2{margin:0;font:900 clamp(1.6rem,4.6vw,2.3rem)/1.05 Archivo,sans-serif;font-stretch:112%;letter-spacing:-.035em}
.name{margin:0;font:900 clamp(2rem,9vw,3.6rem)/1 Archivo,sans-serif;font-stretch:125%;letter-spacing:-.04em;word-break:break-all}
.tag{display:inline-block;padding:1px 10px;border:2px solid var(--ink);border-radius:6px;background:var(--card);font:700 .85rem/1.6 Archivo,sans-serif;font-stretch:75%;letter-spacing:.03em}
.tag.s{background:var(--sun)}.tag.i{background:var(--iris);color:#fff}.tag.p{background:var(--pine);color:#fff}
.compose,.cp,.note{padding:20px 22px;margin-bottom:22px}
.cp{background:var(--pineS)}.cp.priv{background:var(--sunS)}
.cprow{display:flex;gap:10px;align-items:flex-start}.cprow input{margin:0;font-size:.9rem}.cprow .btn{flex:none}
.cnt{font-size:.9rem;font-weight:700}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.note{border-style:dashed;box-shadow:none;font-weight:700}
.mc{padding:18px 20px;margin-bottom:22px}
.mc:nth-child(3n+1){background:var(--sunS)}.mc:nth-child(3n+2){background:var(--irisS)}.mc:nth-child(3n){background:var(--pineS)}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
time{font-size:.85rem;font-weight:600}
.body{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:1.08rem;font-weight:600}
.reply{margin-top:14px;padding:12px 16px;border:3px solid var(--ink);border-radius:14px;background:var(--card);box-shadow:4px 4px 0 var(--iris)}
.reply .body{margin:6px 0 4px}
.rf{margin-top:14px}.rf textarea{min-height:84px}
.acts{display:flex;gap:6px;margin-top:10px}
.foot{margin-top:40px;display:flex;justify-content:center}
@media (max-width:820px){.hero{grid-template-columns:1fr;gap:36px;padding-top:112px}.badge{max-width:260px}}
@media (max-width:560px){
.dock{top:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:calc(100% - 24px);max-width:420px;padding:5px}
.logo{display:none}.dock .pill{flex:1;text-align:center;min-height:44px;line-height:2}
.hero{padding-top:calc(36px + env(safe-area-inset-top,0px));padding-bottom:110px}
.pg{padding:calc(28px + env(safe-area-inset-top,0px)) 0 120px}
.cprow{flex-direction:column}.cprow input{width:100%}.btn{min-height:46px}
}
@media (hover:none){.btn:hover{transform:none;box-shadow:4px 4px 0 var(--ink)}}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ===== ISI PUNYAMU (Supabase > Project Settings > API) =====
const SUPABASE_URL = "https://atltoiaobzyjpccrpanz.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_K_OIeByHE8-VScthbcRXzQ_UXdU-rA0";
// ===========================================================

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $app = document.getElementById("app");
const USER_RE = /^[a-z0-9_]{3,20}$/;
const rand = n => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => b.toString(16).padStart(2, "0")).join("");
const LS = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch {} },
  del(k){ try { localStorage.removeItem(k); } catch {} }
};
const SENDER = LS.get("sk_sender") || rand(16);   // token anonim pengirim, hanya di browser ini
LS.set("sk_sender", SENDER);
const keys = () => { try { return JSON.parse(LS.get("sk_keys") || "{}"); } catch { return {}; } };
const saveKey = (u,k) => { const m = keys(); m[u] = k; LS.set("sk_keys", JSON.stringify(m)); LS.set("sk_me", u); };
const base = () => location.origin + location.pathname;
const shareUrl = u => base() + "?u=" + u;
const fmt = d => new Date(d).toLocaleString("id-ID", { dateStyle: "medium", timeStyle: "short" });

function el(tag, attrs = {}, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)){
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e[k] = v;
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  e.append(...kids.flat().filter(x => x != null && x !== false));
  return e;
}
const show = (...n) => $app.replaceChildren(...n);
const page = (...k) => el("main", { class: "wrap pg" }, ...k);
const say = (e,t,ok) => { e.textContent = t; e.className = "msg" + (ok ? " ok" : ""); };
const dock = () => el("header", { class: "dock" },
  el("a", { class: "logo", href: "./" }, "kotak rahasia"),
  el("a", { class: "pill solid", href: "./?new=1" }, "Buat kotak"));

function copyRow(label, value, note, cls = ""){
  const i = el("input", { readonly: "readonly", value, "aria-label": label });
  const b = el("button", { class: "btn alt", type: "button" }, "Salin");
  b.onclick = async () => {
    try { await navigator.clipboard.writeText(value); b.textContent = "Tersalin"; setTimeout(() => b.textContent = "Salin", 1600); }
    catch { i.select(); }
  };
  return el("div", { class: "box cp " + cls }, el("span", { class: "lbl" }, label), note && el("p", { class: "hint" }, note), el("div", { class: "cprow" }, i, b));
}

/* ---------- Beranda: buat kotak cukup dengan username ---------- */
function homePage(){
  const inp = el("input", { id: "u", maxlength: "20", placeholder: "username", autocapitalize: "off", autocomplete: "off", spellcheck: "false" });
  const st = el("p", { class: "msg", role: "status" });
  const go = el("button", { class: "btn", type: "button" }, "Buat kotak");
  const submit = async () => {
    const u = inp.value.trim().toLowerCase();
    if (!USER_RE.test(u)) return say(st, "Username 3–20 karakter: huruf kecil, angka, atau _.");
    go.disabled = true;
    const key = rand(24);
    const { error } = await sb.rpc("create_box", { p_username: u, p_key: key });
    go.disabled = false;
    if (error) return say(st, error.code === "23505" ? "Username itu sudah dipakai. Coba yang lain." : "Gagal membuat kotak. Coba lagi.");
    saveKey(u, key);
    history.replaceState(null, "", shareUrl(u));
    threadPage(u);
  };
  go.onclick = submit;
  inp.onkeydown = e => { if (e.key === "Enter") submit(); };
  show(dock(), el("div", { class: "wrap hero" },
    el("div", {},
      el("h1", {}, el("span", {}, "Pesan"), el("span", {}, "tanpa"), el("span", {}, "nama.")),
      el("p", { class: "sub" }, "Satu tautan, siapa saja bisa menulis. Cuma kamu yang bisa membalas."),
      el("ul", { class: "strip" }, el("li", {}, "Tanpa login"), el("li", {}, "Tanpa email"), el("li", {}, "Gratis"))),
    el("div", { class: "box badge" }, el("label", { class: "lbl", for: "u" }, "Pilih username"), inp, go, st)));
}

/* ---------- Kartu pesan ---------- */
function replyForm(m, name, key, existing){
  const ta = el("textarea", { maxlength: "500", placeholder: "Tulis balasan. Semua pengunjung bisa membacanya.", "aria-label": "Balasan" });
  ta.value = existing || "";
  const st = el("p", { class: "msg", role: "status" });
  const b = el("button", { class: "btn", type: "button" }, existing ? "Simpan balasan" : "Balas");
  b.onclick = async () => {
    const t = ta.value.trim();
    if (!t) return say(st, "Balasan masih kosong.");
    b.disabled = true;
    const { error } = await sb.rpc("reply_message", { p_username: name, p_key: key, p_id: m.id, p_reply: t });
    b.disabled = false;
    if (error) return say(st, "Balasan gagal dikirim. Coba lagi.");
    threadPage(name);
  };
  return el("div", { class: "rf" }, ta, b, st);
}

function card(m, name, owner, key){
  const c = el("article", { class: "box mc" },
    el("div", { class: "meta" }, el("span", { class: "tag" + (m.mine ? " s" : "") }, m.mine ? "Pesanmu" : "Anonim"), el("time", {}, fmt(m.created_at))),
    el("p", { class: "body" }, m.body));
  if (m.reply) c.append(el("div", { class: "reply" },
    el("span", { class: "tag i" }, "Balasan @" + name), el("p", { class: "body" }, m.reply), el("time", {}, fmt(m.replied_at))));
  if (owner){
    const slot = el("div"), acts = el("div", { class: "acts" });
    if (m.reply){
      const ed = el("button", { class: "pill", type: "button" }, "Ubah balasan");
      ed.onclick = () => { ed.remove(); slot.append(replyForm(m, name, key, m.reply)); };
      acts.append(ed);
    } else slot.append(replyForm(m, name, key, ""));
    const del = el("button", { class: "pill", type: "button" }, "Hapus pesan");
    del.onclick = async () => {
      if (!confirm("Hapus pesan ini beserta balasannya?")) return;
      const { error } = await sb.rpc("delete_message", { p_username: name, p_key: key, p_id: m.id });
      if (!error) threadPage(name);
    };
    acts.append(del);
    c.append(slot, acts);
  }
  return c;
}

/* ---------- Tampilan pengunjung ---------- */
function visitorView(name, data){
  const ta = el("textarea", { maxlength: "500", placeholder: "Tulis pesanmu di sini. Namamu tidak akan terlihat.", "aria-label": "Pesan" });
  const cnt = el("span", { class: "cnt" }, "0/500");
  ta.oninput = () => cnt.textContent = ta.value.length + "/500";
  const st = el("p", { class: "msg", role: "status" });
  const btn = el("button", { class: "btn", type: "button" }, "Kirim pesan");
  btn.onclick = async () => {
    const t = ta.value.trim();
    if (!t) return say(st, "Pesan masih kosong. Tulis sesuatu dulu.");
    btn.disabled = true;
    const { error } = await sb.rpc("send_message", { p_username: name, p_sender: SENDER, p_body: t });
    btn.disabled = false;
    if (error) return say(st, (error.message || "").includes("rate_limited") ? "Terlalu cepat. Tunggu semenit lalu kirim lagi." : "Pesan gagal terkirim. Coba lagi.");
    threadPage(name);
  };
  const thread = data.can_view
    ? [el("div", { class: "sh" }, el("h2", {}, "Pesan di kotak ini"), el("button", { class: "pill", type: "button", onclick: () => threadPage(name) }, "Muat ulang")),
       ...(data.messages.length ? data.messages.map(m => card(m, name, false, null)) : [el("p", {}, "Belum ada pesan.")])]
    : [el("div", { class: "box note" }, "Kirim satu pesan dulu untuk membaca pesan lain di kotak ini.")];
  show(dock(), page(
    el("p", { class: "lbl" }, "Kirim pesan anonim ke"),
    el("h1", { class: "name" }, "@" + name),
    el("div", { class: "box compose", style: "margin-top:22px" }, ta, el("div", { class: "bar" }, cnt, btn), st),
    ...thread));
}

/* ---------- Tampilan pemilik ---------- */
function ownerView(name, key, data){
  const forget = el("button", { class: "pill", type: "button" }, "Keluar dari kotak ini");
  forget.onclick = () => {
    if (!confirm("Hapus kunci dari browser ini? Tanpa tautan pribadi, kamu tidak bisa membalas lagi dari sini.")) return;
    const m = keys(); delete m[name]; LS.set("sk_keys", JSON.stringify(m));
    if (LS.get("sk_me") === name) LS.del("sk_me");
    threadPage(name);
  };
  show(dock(), page(
    el("span", { class: "tag p" }, "Kotakmu"),
    el("h1", { class: "name", style: "margin-top:8px" }, "@" + name),
    el("div", { style: "margin-top:24px" },
      copyRow("Tautan untuk dibagikan", shareUrl(name), "Tempel di bio atau status. Siapa saja bisa mengirim pesan lewat tautan ini."),
      copyRow("Tautan pribadi", shareUrl(name) + "#k=" + key, "Jangan dibagikan. Buka tautan ini di HP atau laptop lain agar bisa membalas dari sana. Simpan juga kalau-kalau data browser terhapus.", "priv")),
    el("div", { class: "sh" }, el("h2", {}, "Pesan masuk (" + data.messages.length + ")"), el("button", { class: "pill", type: "button", onclick: () => threadPage(name) }, "Muat ulang")),
    ...(data.messages.length ? data.messages.map(m => card(m, name, true, key)) : [el("div", { class: "box note" }, "Belum ada pesan. Bagikan tautanmu dulu.")]),
    el("div", { class: "foot" }, forget)));
}

async function threadPage(name){
  if (!$app.firstChild) show(dock(), page(el("p", {}, "Memuat…")));
  const key = keys()[name] || null;
  const { data, error } = await sb.rpc("get_thread", { p_username: name, p_sender: SENDER, p_key: key });
  if (error) return show(dock(), page(el("div", { class: "box note" }, "Gagal memuat. Cek koneksi lalu muat ulang halaman.")));
  if (!data.exists) return show(dock(), page(
    el("div", { class: "box note" }, el("h2", {}, "Kotak tidak ditemukan"), el("p", {}, "Belum ada kotak bernama @" + name + "."),
      el("a", { class: "btn", href: "./?new=1" }, "Buat kotak"))));
  data.owner ? ownerView(name, key, data) : visitorView(name, data);
}

function route(){
  const q = new URLSearchParams(location.search);
  let u = (q.get("u") || "").toLowerCase();
  const hk = new URLSearchParams(location.hash.slice(1)).get("k");
  if (q.has("new")) return homePage();
  if (u && hk){ saveKey(u, hk); history.replaceState(null, "", shareUrl(u)); }   // tautan pribadi: simpan kunci lalu bersihkan URL
  if (!u){ const me = LS.get("sk_me"); if (me && keys()[me]){ u = me; history.replaceState(null, "", shareUrl(u)); } }
  u ? threadPage(u) : homePage();
}
route();
</script>
</body>
</html>
