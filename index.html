<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
:root{--paper:#f9f5f8;--ink:#5f3c4e;--card:#fffdfe;--sun:#f6cbd6;--iris:#e9a1b7;--pine:#d6e8a6;--coral:#d6e8a6;--sunS:#fdf0f4;--irisS:#fbe3ea;--pineS:#f0f7de;--focus:#d8708e;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1rem/1.65 Archivo,system-ui,sans-serif;overflow-x:hidden;-webkit-text-size-adjust:100%}
a{color:inherit}a,button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.wrap{max-width:1060px;margin:0 auto;padding:0 max(20px,env(safe-area-inset-right)) 0 max(20px,env(safe-area-inset-left))}
.box{background:var(--card);border:3px solid var(--ink);border-radius:20px;box-shadow:6px 6px 0 var(--ink)}
/* dock */
.dock{position:fixed;z-index:20;top:12px;left:50%;transform:translateX(-50%);width:min(94%,740px);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 8px 6px 18px;background:var(--card);border:3px solid var(--ink);border-radius:99px;box-shadow:4px 4px 0 var(--ink)}
.logo{font:900 1rem/1 Archivo,sans-serif;font-stretch:112%;letter-spacing:-.03em;text-decoration:none}
.pill{display:inline-block;padding:6px 14px;border:2px solid transparent;border-radius:99px;background:transparent;color:var(--ink);font:700 .9rem/1.3 Archivo,sans-serif;font-stretch:87%;text-decoration:none;cursor:pointer}
.pill:hover{background:var(--sun);border-color:var(--ink)}
.pill.solid{background:var(--ink);color:var(--paper)}.pill.solid:hover{background:var(--coral);color:var(--ink)}
/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:48px;align-items:center;padding:128px 0 76px}
h1{margin:0 0 14px;font:900 clamp(2.6rem,10.5vw,5.6rem)/.95 Archivo,sans-serif;font-stretch:125%;letter-spacing:-.04em}
h1 span{display:block;width:max-content;max-width:100%;margin-bottom:12px;padding:.04em .2em .1em;border:3px solid var(--ink);border-radius:14px;box-shadow:5px 5px 0 var(--ink)}
h1 span:nth-child(1){background:var(--sun);transform:rotate(-1.5deg)}
h1 span:nth-child(2){background:var(--coral);transform:rotate(1deg);margin-left:6vw}
h1 span:nth-child(3){background:var(--iris);color:var(--ink);transform:rotate(-.5deg)}
.sub{max-width:30rem;margin:6px 0 26px;font:italic 800 clamp(1.2rem,3.4vw,1.8rem)/1.25 Archivo,sans-serif;letter-spacing:-.03em}
.strip{display:flex;width:max-content;max-width:100%;margin:0;padding:0;list-style:none;overflow:hidden;border:3px solid var(--ink);border-radius:12px;background:var(--card)}
.strip li{padding:5px 14px;border-right:3px solid var(--ink);font:700 .9rem/1.6 Archivo,sans-serif;font-stretch:87%}
.strip li:last-child{border:0}.strip li:nth-child(1){background:var(--sun)}.strip li:nth-child(2){background:var(--pine);color:var(--ink)}
.badge{position:relative;justify-self:center;width:100%;max-width:300px;padding:36px 18px 18px;transform:rotate(-3deg)}
.badge::before{content:"";position:absolute;top:12px;left:50%;width:54px;height:14px;margin-left:-27px;border:3px solid var(--ink);border-radius:99px;background:var(--paper)}
/* form bits */
.lbl{display:block;margin:0 0 8px;font:700 1rem/1.3 Archivo,sans-serif;font-stretch:87%}
.hint{margin:0 0 8px;font-size:.92rem}
input,textarea{width:100%;margin:0 0 12px;padding:11px 14px;border:3px solid var(--ink);border-radius:12px;background:var(--card);color:var(--ink);font:600 1rem/1.5 Archivo,sans-serif;box-shadow:3px 3px 0 var(--ink)}
textarea{min-height:130px;resize:vertical}
input:focus,textarea:focus{outline:3px solid var(--focus);outline-offset:2px}
.btn{display:inline-block;padding:10px 20px;border:3px solid var(--ink);border-radius:12px;background:var(--sun);color:var(--ink);font:800 1rem/1.3 Archivo,sans-serif;text-decoration:none;cursor:pointer;box-shadow:4px 4px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.btn.alt{background:var(--card)}.btn:disabled{opacity:.55;cursor:wait}
.msg{min-height:1.5em;margin:10px 0 0;font-weight:700;font-size:.95rem;color:#a02f48}.msg.ok{color:#4a6a14}
/* pages */
.pg{padding:112px 0 72px;max-width:760px}
.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:36px 0 22px;padding-bottom:10px;border-bottom:3px solid var(--ink)}
h2{margin:0;font:900 clamp(1.6rem,4.6vw,2.3rem)/1.05 Archivo,sans-serif;font-stretch:112%;letter-spacing:-.035em}
.name{margin:0;font:900 clamp(2rem,9vw,3.6rem)/1 Archivo,sans-serif;font-stretch:125%;letter-spacing:-.04em;word-break:break-all}
.tag{display:inline-block;padding:1px 10px;border:2px solid var(--ink);border-radius:6px;background:var(--card);font:700 .85rem/1.6 Archivo,sans-serif;font-stretch:75%;letter-spacing:.03em}
.tag.s{background:var(--sun)}.tag.i{background:var(--iris);color:var(--ink)}.tag.p{background:var(--pine);color:var(--ink)}
.compose,.cp,.note{padding:20px 22px;margin-bottom:22px}
.cp{background:var(--pineS)}.cp.priv{background:var(--sunS)}
.cprow{display:flex;gap:10px;align-items:flex-start}.cprow input{margin:0;font-size:.9rem}.cprow .btn{flex:none}
.cnt{font-size:.9rem;font-weight:700}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.note{border-style:dashed;box-shadow:none;font-weight:700}
.mc{padding:18px 20px;margin-bottom:22px}
.mc:nth-child(3n+1){background:var(--sunS)}.mc:nth-child(3n+2){background:var(--irisS)}.mc:nth-child(3n){background:var(--pineS)}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
time{font-size:.85rem;font-weight:600}
.body{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:1.08rem;font-weight:600}
.reply{margin-top:14px;padding:12px 16px;border:3px solid var(--ink);border-radius:14px;background:var(--card);box-shadow:4px 4px 0 var(--iris)}
.reply .body{margin:6px 0 4px}
.rf{margin-top:14px}.rf textarea{min-height:84px}
.acts{display:flex;gap:6px;margin-top:10px}
.foot{margin-top:40px;display:flex;justify-content:center}
/* password & percakapan */
.opts{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.opt{padding:6px 14px;border:2px solid var(--ink);border-radius:99px;background:var(--card);color:var(--ink);font:700 .9rem/1.3 Archivo,sans-serif;font-stretch:87%;cursor:pointer}
.opt[aria-pressed="true"]{background:var(--iris);box-shadow:2px 2px 0 var(--ink)}
.pwrow{display:flex;gap:8px;align-items:flex-start}.pwrow input{margin:0}.pwrow .pill{flex:none;border-color:var(--ink)}.pwrow .btn{flex:none}
.chain{margin:26px 0;padding-left:16px;border-left:4px solid var(--iris)}
.chain>.lbl{margin:0 0 12px}
/* pesawat kertas */
.pp{display:block;width:100%;height:auto;overflow:visible;filter:drop-shadow(2px 0 0 var(--ink)) drop-shadow(-2px 0 0 var(--ink)) drop-shadow(0 2px 0 var(--ink)) drop-shadow(0 -2px 0 var(--ink)) drop-shadow(4px 5px 0 var(--ink))}
.ppfly{position:fixed;z-index:60;width:210px;height:210px;margin:-105px 0 0 -105px;pointer-events:none;will-change:transform,opacity}
.ppland{position:absolute;z-index:5;left:50%;top:50%;width:150px;height:150px;margin:-75px 0 0 -75px;pointer-events:none;will-change:transform,opacity}
.mc{position:relative;transition:background-color .35s,border-color .35s,box-shadow .35s}
.mc>*:not(.ppland){transition:opacity .4s .1s}
.mc.pre{background:transparent!important;border-color:transparent;box-shadow:none;pointer-events:none}
.mc.pre>*:not(.ppland){opacity:0}
@media (prefers-reduced-motion:reduce){.ppfly,.ppland{display:none}}
@media (max-width:820px){.hero{grid-template-columns:1fr;gap:36px;padding-top:112px}.badge{max-width:260px}}
@media (max-width:560px){
.dock{top:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:calc(100% - 24px);max-width:420px;padding:5px}
.logo{display:none}.dock .pill{flex:1;text-align:center;min-height:44px;line-height:2}
.hero{padding-top:calc(36px + env(safe-area-inset-top,0px));padding-bottom:110px}
.pg{padding:calc(28px + env(safe-area-inset-top,0px)) 0 120px}
.cprow{flex-direction:column}.cprow input{width:100%}.btn{min-height:46px}
}
@media (hover:none){.btn:hover{transform:none;box-shadow:4px 4px 0 var(--ink)}}
</style>

<script>

const USER_RE = /^[a-z0-9_]{3,20}$/;

function el(tag, attrs = {}, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)){
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e[k] = v;

function copyRow(label, value, note, cls = ""){

/* ---------- Animasi pesawat kertas ---------- */
const NOMOTION = () => !Element.prototype.animate || matchMedia("(prefers-reduced-motion: reduce)").matches;
const clamp01 = x => Math.max(0, Math.min(1, x));
const lerp = (a, b, t) => a + (b - a) * t;
const easeIO = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const sleep = ms => new Promise(r => setTimeout(r, ms));
// tween: panggil fn(0..1) selama ms; tetap selesai walau tab di latar belakang
const tween = (ms, fn) => new Promise(res => {
  const t0 = performance.now(); let done = false;
  const end = () => { if (!done){ done = true; fn(1); res(); } };
  setTimeout(end, ms + 300);
  const f = now => { if (done) return; const k = Math.min(1, (now - t0) / ms); fn(k); k < 1 ? requestAnimationFrame(f) : end(); };
  requestAnimationFrame(f);
});
const play = (node, frames, opts) => {
  const a = node.animate(frames, opts);
  return Promise.race([a.finished.catch(() => {}), sleep(opts.duration + 400)]);
};

// Bentuk tiap sisi kertas: 4 pose (kertas datar, sudut dilipat, dilipat dua, sayap terbuka)
const PK = {
  B:  [[[100,30],[140,30],[140,170],[100,170]], [[100,30],[140,70],[140,170],[100,170]], [[100,30],[60,70],[60,170],[100,170]], [[100,30],[162,138],[108,152],[100,112]]],
  A:  [[[100,30],[60,30],[60,170],[100,170]],   [[100,30],[60,70],[60,170],[100,170]],   [[100,30],[60,70],[60,170],[100,170]],  [[100,30],[38,138],[92,152],[100,112]]],
  C:  [[[100,112],[100,150],[100,172],[100,150]], [[100,112],[100,150],[100,172],[100,150]], [[100,112],[100,150],[100,172],[100,150]], [[100,112],[92,152],[100,174],[108,152]]],
  FL: [[[100,30],[60,70],[60,30],[60,30]],      [[100,30],[60,70],[100,70],[100,70]],    [[100,30],[60,70],[100,70],[100,70]],   [[100,30],[90,58],[100,58],[100,58]]],
  FR: [[[100,30],[140,70],[140,30],[140,30]],   [[100,30],[140,70],[100,70],[100,70]],   [[100,30],[60,70],[100,70],[100,70]],   [[100,30],[110,58],[100,58],[100,58]]]
};
const SEG = [0, .33, .62, 1];
const hexRgb = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
const mixCol = (a, b, t) => { const x = hexRgb(a), y = hexRgb(b); return "rgb(" + x.map((v, i) => Math.round(lerp(v, y[i], t))).join(",") + ")"; };

// paperPlane().set(p): p=0 kertas datar, p=1 pesawat kertas
function paperPlane(){
  const NS = "http://www.w3.org/2000/svg";
  const mk = (t, a = {}) => { const n = document.createElementNS(NS, t); for (const k in a) n.setAttribute(k, a[k]); return n; };
  const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const C = { card: css("--card"), sun: css("--sun"), iris: css("--iris"), irisS: css("--irisS"), ink: css("--ink") };
  const svg = mk("svg", { viewBox: "0 0 200 200", class: "pp", "aria-hidden": "true" });
  const g = mk("g", { "stroke-linejoin": "round" });
  const faces = {};
  for (const k of ["B", "A", "C", "FL", "FR"]) g.append(faces[k] = mk("polygon"));
  const lines = mk("g", { stroke: C.ink, "stroke-width": "3.5", "stroke-linecap": "round" });
  [[80,132],[94,132],[108,132],[122,132],[136,132],[150,106]].forEach(([y, x2]) => lines.append(mk("line", { x1: 68, y1: y, x2, y2: y })));
  g.append(lines); svg.append(g);
  const set = p => {
    p = clamp01(p);
    const i = p < SEG[1] ? 0 : p < SEG[2] ? 1 : 2;
    const t = easeIO((p - SEG[i]) / (SEG[i + 1] - SEG[i]));
    for (const k in PK){
      const a = PK[k][i], b = PK[k][i + 1];
      faces[k].setAttribute("points", a.map((q, j) => lerp(q[0], b[j][0], t).toFixed(1) + "," + lerp(q[1], b[j][1], t).toFixed(1)).join(" "));
    }
    faces.A.setAttribute("fill", C.card);
    faces.B.setAttribute("fill", mixCol(C.card, C.irisS, easeIO(clamp01((p - .33) / .4))));
    faces.C.setAttribute("fill", C.iris);
    faces.C.setAttribute("opacity", clamp01((p - .62) / .2));
    const fl = mixCol(C.card, C.sun, easeIO(clamp01(p / .33)));
    faces.FL.setAttribute("fill", fl); faces.FR.setAttribute("fill", fl);
    lines.setAttribute("opacity", .45 * (1 - clamp01(p / .12)));
  };
  set(0);
  return { svg, set };
}

/* Pengirim: kertas muncul dari kotak tulis, dilipat jadi pesawat, lalu terbang sampai hilang */
function launchPlane(rect){
  if (NOMOTION()) return null;
  const cx = Math.min(Math.max(rect.left + rect.width / 2, 110), innerWidth - 110);
  const cy = Math.min(Math.max(rect.top + rect.height / 2, 110), innerHeight - 110);
  const pp = paperPlane();
  const box = el("div", { class: "ppfly", style: "left:" + cx + "px;top:" + cy + "px" }, pp.svg);
  document.body.append(box);
  let idle = null;
  const ready = (async () => {
    await play(box, [{ opacity: 0, transform: "translateY(18px) scale(.6)" }, { opacity: 1, transform: "none" }], { duration: 280, easing: "ease-out", fill: "forwards" });
    await tween(1250, k => pp.set(k));
    idle = box.animate([{ transform: "translateY(0) rotate(0deg)" }, { transform: "translateY(-9px) rotate(2.5deg)" }], { duration: 650, direction: "alternate", iterations: Infinity, easing: "ease-in-out" });
  })();
  return {
    ready,
    async fly(){
      await ready; if (idle) idle.cancel();
      const dx = innerWidth - cx + 280, dy = -(cy + 280), h = Math.atan2(dx, -dy) * 180 / Math.PI;
      await play(box, [
        { transform: "translate(0,0) rotate(0deg) scale(1)", opacity: 1, offset: 0 },
        { transform: "translate(-16px,12px) rotate(-9deg) scale(1.03)", opacity: 1, offset: .16 },
        { transform: "translate(" + dx * .3 + "px," + (dy * .3 + 26) + "px) rotate(" + h * .6 + "deg) scale(.8)", opacity: 1, offset: .45 },
        { transform: "translate(" + dx * .68 + "px," + (dy * .66 - 18) + "px) rotate(" + (h + 6) + "deg) scale(.45)", opacity: 1, offset: .75 },
        { transform: "translate(" + dx + "px," + dy + "px) rotate(" + h + "deg) scale(.14)", opacity: 0, offset: 1 }
      ], { duration: 1500, easing: "cubic-bezier(.4,0,.8,.7)", fill: "forwards" });
      box.remove();
    },
    async drop(){   // dipakai kalau pengiriman gagal
      if (idle) idle.cancel();
      await play(box, [{ opacity: 1, transform: "none" }, { opacity: 0, transform: "translateY(34px) rotate(-14deg) scale(.5)" }], { duration: 360, easing: "ease-in", fill: "forwards" });
      box.remove();
    }
  };
}

/* Penerima: pesawat kertas datang, mendarat di tempat pesan, lalu membuka diri */
const seenKey = n => "sk_seen_" + n;
const seenSet = n => { try { return new Set(JSON.parse(LS.get(seenKey(n)) || "[]")); } catch { return new Set(); } };
const markSeen = (n, id) => { const s = seenSet(n); s.add(String(id)); LS.set(seenKey(n), JSON.stringify([...s].slice(-500))); };
let arrivalGap = Promise.resolve();

function arrival(c, name, id, seen){
  if (seen.has(String(id)) || NOMOTION() || !("IntersectionObserver" in window)) return c;
  const holder = el("div", { class: "ppland" });
  c.classList.add("pre");
  c.append(holder);
  const io = new IntersectionObserver(es => {
    if (!es.some(e => e.isIntersecting)) return;
    io.disconnect();
    arrivalGap = arrivalGap.then(() => { land(c, holder, name, id); return sleep(420); });   // beberapa pesan datang berurutan
  }, { threshold: .2 });
  io.observe(c);
  return c;
}

async function land(c, holder, name, id){
  try {
    const pp = paperPlane(); pp.set(1); holder.append(pp.svg);
    const r = holder.getBoundingClientRect();
    const sx = innerWidth - (r.left + r.width / 2) + 180, sy = -(r.top + r.height / 2) - 180;
    const ang = Math.atan2(-sx, sy) * 180 / Math.PI;
    await play(holder, [
      { transform: "translate(" + sx + "px," + sy + "px) rotate(" + ang + "deg) scale(.5)", opacity: 0, offset: 0 },
      { opacity: 1, offset: .1 },
      { transform: "translate(" + sx * .4 + "px," + (sy * .4 - 40) + "px) rotate(" + ang * .85 + "deg) scale(.8)", opacity: 1, offset: .55 },
      { transform: "translate(" + sx * .08 + "px," + sy * .1 + "px) rotate(" + ang * .2 + "deg) scale(.95)", opacity: 1, offset: .86 },
      { transform: "translate(0,0) rotate(0deg) scale(1)", opacity: 1, offset: 1 }
    ], { duration: 1500, easing: "cubic-bezier(.25,.6,.35,1)", fill: "forwards" });
    holder.animate([{ transform: "none" }, { transform: "scale(1.3)" }], { duration: 1000, easing: "ease-out", fill: "forwards" });
    await tween(1000, k => pp.set(1 - k));
    holder.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 260, fill: "forwards" });
  } catch {}
  c.classList.remove("pre");
  c.animate([{ transform: "scale(.35) rotate(-4deg)" }, { transform: "scale(1.025)", offset: .6 }, { transform: "none" }], { duration: 560, easing: "cubic-bezier(.2,.9,.3,1)" });
  markSeen(name, id);
  setTimeout(() => holder.remove(), 320);
}

/* ---------- Beranda: buat kotak cukup dengan username ---------- */
function homePage(){
  const inp = el("input", { id: "u", maxlength: "20", placeholder: "username", autocapitalize: "off", autocomplete: "off", spellcheck: "false" });
  const st = el("p", { class: "msg", role: "status" });
  const go = el("button", { class: "btn", type: "button" }, "Buat kotak");
  const submit = async () => {
    const u = inp.value.trim().toLowerCase();
    if (!USER_RE.test(u)) return say(st, "Username 3–20 karakter: huruf kecil, angka, atau _.");
    go.disabled = true;
    const key = rand(24);
    const { error } = await sb.rpc("create_box", { p_username: u, p_key: key });
    go.disabled = false;
    if (error) return say(st, error.code === "23505" ? "Username itu sudah dipakai. Coba yang lain." : "Gagal membuat kotak: " + (error.message || error.code || "tidak diketahui"));
    saveKey(u, key);
    history.replaceState(null, "", shareUrl(u));
    threadPage(u);
  };
  go.onclick = submit;
  inp.onkeydown = e => { if (e.key === "Enter") submit(); };
  show(dock(), el("div", { class: "wrap hero" },
    el("div", {},
      el("h1", {}, el("span", {}, "Pesan"), el("span", {}, "tanpa"), el("span", {}, "nama.")),
      el("p", { class: "sub" }, "Satu tautan, siapa saja bisa menulis. Cuma kamu yang bisa membalas."),
      el("ul", { class: "strip" }, el("li", {}, "Tanpa login"), el("li", {}, "Tanpa email"), el("li", {}, "Gratis"))),
    el("div", { class: "box badge" }, el("label", { class: "lbl", for: "u" }, "Pilih username"), inp, go, st)));
}

/* ---------- Kartu pesan ---------- */
function replyForm(m, name, key, existing){
  const ta = el("textarea", { maxlength: "500", placeholder: "Tulis balasan. Semua pengunjung bisa membacanya.", "aria-label": "Balasan" });
  ta.value = existing || "";
  const st = el("p", { class: "msg", role: "status" });
  const b = el("button", { class: "btn", type: "button" }, existing ? "Simpan balasan" : "Balas");
  b.onclick = async () => {
    const t = ta.value.trim();
    if (!t) return say(st, "Balasan masih kosong.");
    b.disabled = true;
    const { error } = await sb.rpc("reply_message", { p_username: name, p_key: key, p_id: m.id, p_reply: t });
    b.disabled = false;
    if (error) return say(st, "Balasan gagal dikirim. Coba lagi.");
    threadPage(name);
  };
  return el("div", { class: "rf" }, ta, b, st);
}

function card(m, name, owner, key){
  const c = el("article", { class: "box mc" },
    el("div", { class: "meta" }, el("span", { class: "tag" + (m.mine ? " s" : "") }, m.mine ? "Pesanmu" : "Anonim"), el("time", {}, fmt(m.created_at))),
    el("p", { class: "body" }, m.body));
  if (m.reply) c.append(el("div", { class: "reply" },
    el("span", { class: "tag i" }, "Balasan @" + name), el("p", { class: "body" }, m.reply), el("time", {}, fmt(m.replied_at))));
  if (owner){
    const slot = el("div"), acts = el("div", { class: "acts" });
    if (m.reply){
      const ed = el("button", { class: "pill", type: "button" }, "Ubah balasan");
      ed.onclick = () => { ed.remove(); slot.append(replyForm(m, name, key, m.reply)); };
      acts.append(ed);
    } else slot.append(replyForm(m, name, key, ""));
    const del = el("button", { class: "pill", type: "button" }, "Hapus pesan");
    del.onclick = async () => {
      if (!confirm("Hapus pesan ini beserta balasannya?")) return;
      const { error } = await sb.rpc("delete_message", { p_username: name, p_key: key, p_id: m.id });
      if (!error) threadPage(name);
    };
    acts.append(del);
    c.append(slot, acts);
  }
  return c;
}

/* ---------- Easter egg: buka kunci pesan tanpa kirim dulu ---------- */
let shakeOff = null, unlocking = false;
function disarmShake(){ if (shakeOff){ shakeOff(); shakeOff = null; } }

// Goyang HP kuat-kuat sekitar 1 detik. Di iPhone, Safari minta izin sensor gerak saat layar pertama kali disentuh.
function armShake(onShake){
  disarmShake();
  if (!("DeviceMotionEvent" in window)) return;
  let px = null, py = 0, pz = 0, jolts = [], cool = 0;
  const onMotion = e => {
    const a = e.accelerationIncludingGravity;
    if (!a || a.x == null) return;
    const now = Date.now();
    if (px !== null){
      const d = Math.abs(a.x - px) + Math.abs(a.y - py) + Math.abs(a.z - pz);
      if (d > 28 && now - (jolts[jolts.length - 1] || 0) > 90){
        jolts = jolts.filter(t => now - t < 1400); jolts.push(now);
        if (jolts.length >= 5 && now > cool){ cool = now + 4000; jolts = []; onShake(); }
      }
    }
    px = a.x; py = a.y; pz = a.z;
  };
  const start = () => addEventListener("devicemotion", onMotion);
  let stopAsk = () => {};
  if (typeof DeviceMotionEvent.requestPermission === "function"){
    const ask = () => { DeviceMotionEvent.requestPermission().then(r => { if (r === "granted") start(); }).catch(() => {}); };
    addEventListener("pointerdown", ask, { once: true });
    stopAsk = () => removeEventListener("pointerdown", ask);
  } else start();
  shakeOff = () => { removeEventListener("devicemotion", onMotion); stopAsk(); };
}

async function unlockThread(name, rect, out){
  if (unlocking) return;
  unlocking = true; say(out, "");
  const fx = launchPlane(rect);
  const { error } = await sb.rpc("unlock_thread", { p_username: name, p_sender: SENDER });
  if (error){
    if (fx) await fx.drop();
    unlocking = false;
    return say(out, error.code === "PGRST202" ? "Easter egg-nya ketemu! Tapi kuncinya belum dipasang di server Supabase." : "Gagal membuka kotak. Coba lagi.");
  }
  if (fx){ const f = fx.fly(); await fx.ready; await threadPage(name); unlocking = false; await f; }
  else { await threadPage(name); unlocking = false; }
}

/* ---------- Password percakapan: pengirim bisa membalas balasan penerima ---------- */
const pwKey = n => "sk_pw_" + n;
const getPws = n => { try { const a = JSON.parse(LS.get(pwKey(n)) || "[]"); return Array.isArray(a) ? a : []; } catch { return []; } };
const addPw = (n, p) => { const a = getPws(n).filter(x => x !== p); a.push(p); LS.set(pwKey(n), JSON.stringify(a.slice(-10))); };
const delPw = (n, p) => LS.set(pwKey(n), JSON.stringify(getPws(n).filter(x => x !== p)));
// fungsi server mengembalikan {ok:false,error:"..."} untuk salah password dsb.; samakan bentuknya dengan error biasa
const asRes = r => (!r.error && r.data && r.data.ok === false) ? { error: { message: r.data.error } } : r;

function failMsg(e, name){
  const m = (e && e.message) || "";
  if (e && e.code === "PGRST202") return "Fitur password belum dipasang di server. Jalankan SQL-nya dulu.";
  if (m.includes("password_taken")) return "Password itu sudah dipakai di kotak ini. Pilih yang lain.";
  if (m.includes("weak_password")) return "Password minimal 6 karakter.";
  if (m.includes("rate_limited")) return "Terlalu cepat. Tunggu semenit lalu coba lagi.";
  if (m.includes("awaiting_reply")) return "Tunggu @" + name + " membalas dulu.";
  if (m.includes("bad_password")) return "Password tidak cocok lagi. Buka ulang percakapannya.";
  if (m.includes("thread_full")) return "Percakapan ini sudah penuh. Mulai pesan baru.";
  if (m.includes("thread_gone")) return "Percakapan ini sudah dihapus.";
  return "Pesan gagal terkirim. Coba lagi.";
}

// alur kirim bersama: kertas keluar dari kotak tulis, jadi pesawat, terbang; kalau gagal tulisan dikembalikan
async function sendFlow(o){
  const { ta, cnt, btn, st, name } = o;
  const t = ta.value.trim();
  if (!t) return say(st, "Pesan masih kosong. Tulis sesuatu dulu.");
  btn.disabled = true; say(st, "");
  const fx = launchPlane(ta.getBoundingClientRect());
  if (fx){ ta.readOnly = true; ta.value = ""; cnt.textContent = "0/500"; }
  const { error } = await o.call(t);
  if (error){
    if (fx){ await fx.drop(); ta.readOnly = false; ta.value = t; cnt.textContent = t.length + "/500"; }
    btn.disabled = false;
    return say(st, failMsg(error, name));
  }
  if (o.after) o.after();
  if (fx){ const f = fx.fly(); await fx.ready; threadPage(name); await f; }
  else { btn.disabled = false; threadPage(name); }
}

function followupForm(name, pw){
  const ta = el("textarea", { maxlength: "500", placeholder: "Balas @" + name + "…", "aria-label": "Balasanmu" });
  const cnt = el("span", { class: "cnt" }, "0/500");
  ta.oninput = () => cnt.textContent = ta.value.length + "/500";
  const st = el("p", { class: "msg", role: "status" });
  const btn = el("button", { class: "btn", type: "button" }, "Kirim balasan");
  btn.onclick = () => sendFlow({ ta, cnt, btn, st, name,
    call: async t => asRes(await sb.rpc("send_followup", { p_username: name, p_sender: SENDER, p_password: pw, p_body: t })) });
  return el("div", { class: "box compose", style: "margin:16px 0 0" }, ta, el("div", { class: "bar" }, cnt, btn), st);
}

function convoBlock(name, c){
  const lf = el("button", { class: "pill", type: "button" }, "Lupakan password di browser ini");
  lf.onclick = () => { delPw(name, c.pw); threadPage(name); };
  return el("section", { class: "chain" },
    el("div", { class: "sh", style: "margin:0 0 14px" }, el("h2", {}, "Percakapanmu"),
      el("button", { class: "pill", type: "button", onclick: () => threadPage(name) }, "Muat ulang")),
    ...c.messages.map(m => card({ ...m, mine: true }, name, false, null)),
    c.can_followup ? followupForm(name, c.pw) : el("div", { class: "box note" }, "Menunggu balasan @" + name + ". Kembali lagi nanti dengan password yang sama."),
    el("div", { class: "acts" }, lf));
}

function resumePanel(name){
  const pw = el("input", { type: "password", maxlength: "64", placeholder: "Password percakapanmu", autocomplete: "current-password", "aria-label": "Password percakapan" });
  const go = el("button", { class: "btn", type: "button" }, "Buka");
  const st = el("p", { class: "msg", role: "status" });
  const panel = el("div", { hidden: true, style: "margin-top:12px" }, el("div", { class: "pwrow" }, pw, go), st);
  const toggle = el("button", { class: "pill", type: "button" }, "Sudah punya password? Lanjutkan percakapan");
  toggle.onclick = () => { panel.hidden = !panel.hidden; if (!panel.hidden) pw.focus(); };
  const open = async () => {
    if (pw.value.length < 6) return say(st, "Password minimal 6 karakter.");
    go.disabled = true;
    const { data, error } = await sb.rpc("get_my_thread", { p_username: name, p_password: pw.value });
    go.disabled = false;
    if (error) return say(st, failMsg(error, name).replace("Pesan gagal terkirim", "Gagal membuka"));
    if (!data || !data.ok) return say(st, "Password tidak cocok dengan percakapan mana pun di kotak ini.");
    addPw(name, pw.value); threadPage(name);
  };
  go.onclick = open;
  pw.onkeydown = e => { if (e.key === "Enter") open(); };
  return el("div", { style: "margin:-6px 0 22px" }, toggle, panel);
}

// kelompokkan pesan satu percakapan (pemilik): kelompok urut dari yang terbaru, isinya urut dari yang terlama
function msgBlocks(msgs){
  const blocks = [], idx = new Map();
  for (const m of msgs){
    if (m.thread && idx.has(m.thread)){ idx.get(m.thread).push(m); continue; }
    const b = [m]; blocks.push(b); if (m.thread) idx.set(m.thread, b);
  }
  blocks.forEach(b => b.reverse());
  return blocks;
}

/* ---------- Tampilan pengunjung ---------- */
function visitorView(name, data, mines){
  const ta = el("textarea", { maxlength: "500", placeholder: "Tulis pesanmu di sini. Namamu tidak akan terlihat.", "aria-label": "Pesan" });
  const cnt = el("span", { class: "cnt" }, "0/500");
  ta.oninput = () => cnt.textContent = ta.value.length + "/500";
  const st = el("p", { class: "msg", role: "status" });
  const btn = el("button", { class: "btn", type: "button" }, "Kirim pesan");

  // pilihan: tanpa password (satu arah) atau pakai password (bisa membalas balasan penerima)
  let usePw = false;
  const pwIn = el("input", { type: "password", maxlength: "64", placeholder: "Buat password (min. 6 karakter)", autocomplete: "new-password", "aria-label": "Password percakapan" });
  const pwSee = el("button", { class: "pill", type: "button" }, "Lihat");
  pwSee.onclick = () => { const h = pwIn.type === "password"; pwIn.type = h ? "text" : "password"; pwSee.textContent = h ? "Sembunyi" : "Lihat"; };
  const pwBox = el("div", { hidden: true }, el("div", { class: "pwrow" }, pwIn, pwSee));
  const hintNo = "Tanpa password: kamu bisa membaca balasan @" + name + " di browser ini, tapi tidak bisa membalas lagi.";
  const hintPw = "Dengan password, kamu bisa membalas jawaban @" + name + " dari HP atau browser mana pun. Tidak ada fitur lupa password, jadi simpan baik-baik.";
  const modeHint = el("p", { class: "hint" }, hintNo);
  const oNo = el("button", { class: "opt", type: "button", "aria-pressed": "true" }, "Tanpa password");
  const oPw = el("button", { class: "opt", type: "button", "aria-pressed": "false" }, "Pakai password");
  const setMode = v => {
    usePw = v;
    oNo.setAttribute("aria-pressed", String(!v)); oPw.setAttribute("aria-pressed", String(v));
    pwBox.hidden = !v; modeHint.textContent = v ? hintPw : hintNo;
    if (v) pwIn.focus();
  };
  oNo.onclick = () => setMode(false); oPw.onclick = () => setMode(true);

  btn.onclick = () => {
    const pw = pwIn.value;
    if (usePw && pw.length < 6) return say(st, "Password minimal 6 karakter.");
    return sendFlow({ ta, cnt, btn, st, name,
      call: usePw
        ? async t => asRes(await sb.rpc("send_message_pw", { p_username: name, p_sender: SENDER, p_body: t, p_password: pw }))
        : t => sb.rpc("send_message", { p_username: name, p_sender: SENDER, p_body: t }),
      after: usePw ? () => addPw(name, pw) : null });
  };

  const lock = el("div", { class: "box note" }, "Kirim satu pesan dulu untuk membaca pesan lain di kotak ini.");
  const egg = el("p", { class: "msg", role: "status" });
  const thread = data.can_view
    ? [el("div", { class: "sh" }, el("h2", {}, "Pesan di kotak ini"), el("button", { class: "pill", type: "button", onclick: () => threadPage(name) }, "Muat ulang")),
       ...(data.messages.length ? data.messages.map(m => card(m, name, false, null)) : [el("p", {}, "Belum ada pesan.")])]
    : [lock, egg];
  const title = el("h1", { class: "name", style: "user-select:none;-webkit-user-select:none;touch-action:manipulation" }, "@" + name);
  show(dock(), page(
    el("p", { class: "lbl" }, "Kirim pesan anonim ke"),
    title,
    ...(mines || []).map(c => convoBlock(name, c)),
    el("div", { class: "box compose", style: "margin-top:22px" }, ta, el("div", { class: "opts" }, oNo, oPw), modeHint, pwBox, el("div", { class: "bar" }, cnt, btn), st),
    resumePanel(name),
    ...thread));
  if (!data.can_view){
    let taps = 0, last = 0;   // easter egg 1: ketuk @username 5 kali cepat
    title.onclick = () => {
      const now = Date.now(); taps = now - last < 1200 ? taps + 1 : 1; last = now;
      if (title.animate) title.animate([{ transform: "scale(1)" }, { transform: "scale(" + (1 - taps * .012) + ")" }, { transform: "scale(1)" }], { duration: 140 });
      if (taps >= 5){ taps = 0; unlockThread(name, title.getBoundingClientRect(), egg); }
    };
    armShake(() => unlockThread(name, lock.getBoundingClientRect(), egg));   // easter egg 2: kocok HP
  }
}

/* ---------- Tampilan pemilik ---------- */
function ownerView(name, key, data){
  const seen = seenSet(name);
  const forget = el("button", { class: "pill", type: "button" }, "Keluar dari kotak ini");
  forget.onclick = () => {
    if (!confirm("Hapus kunci dari browser ini? Tanpa tautan pribadi, kamu tidak bisa membalas lagi dari sini.")) return;
    const m = keys(); delete m[name]; LS.set("sk_keys", JSON.stringify(m));
    if (LS.get("sk_me") === name) LS.del("sk_me");
    threadPage(name);
  };
  show(dock(), page(
    el("span", { class: "tag p" }, "Kotakmu"),
    el("h1", { class: "name", style: "margin-top:8px" }, "@" + name),
    el("div", { style: "margin-top:24px" },
      copyRow("Tautan untuk dibagikan", shareUrl(name), "Tempel di bio atau status. Siapa saja bisa mengirim pesan lewat tautan ini."),
      copyRow("Tautan pribadi", shareUrl(name) + "#k=" + key, "Jangan dibagikan. Buka tautan ini di HP atau laptop lain agar bisa membalas dari sana. Simpan juga kalau-kalau data browser terhapus.", "priv")),
    el("div", { class: "sh" }, el("h2", {}, "Pesan masuk (" + data.messages.length + ")"), el("button", { class: "pill", type: "button", onclick: () => threadPage(name) }, "Muat ulang")),
    ...(data.messages.length ? msgBlocks(data.messages).map(bl => {
      const cs = bl.map(m => arrival(card(m, name, true, key), name, m.id, seen));
      return bl[0].thread ? el("section", { class: "chain" }, el("p", { class: "lbl" }, "Percakapan berpassword" + (bl.length > 1 ? " · " + bl.length + " pesan" : "")), ...cs) : cs[0];
    }) : [el("div", { class: "box note" }, "Belum ada pesan. Bagikan tautanmu dulu.")]),
    el("div", { class: "foot" }, forget)));
}

async function threadPage(name){
  if (!$app.firstChild) show(dock(), page(el("p", {}, "Memuat…")));
  const key = keys()[name] || null;
  const { data, error } = await sb.rpc("get_thread", { p_username: name, p_sender: SENDER, p_key: key });
  if (error) return show(dock(), page(el("div", { class: "box note" }, "Gagal memuat. Cek koneksi lalu muat ulang halaman.")));
  if (!data.exists) return show(dock(), page(
    el("div", { class: "box note" }, el("h2", {}, "Kotak tidak ditemukan"), el("p", {}, "Belum ada kotak bernama @" + name + "."),
      el("a", { class: "btn", href: "./?new=1" }, "Buat kotak"))));
  if (data.owner){
    // tandai pesan yang termasuk percakapan berpassword (fitur opsional; diabaikan kalau belum dipasang di server)
    const tm = await sb.rpc("owner_thread_map", { p_username: name, p_key: key });
    if (!tm.error && tm.data) data.messages.forEach(m => { m.thread = tm.data[String(m.id)] || null; });
    return ownerView(name, key, data);
  }
  const mines = [];
  for (const pw of getPws(name)){
    const r = await sb.rpc("get_my_thread", { p_username: name, p_password: pw });
    if (r.error) break;
    if (r.data && r.data.ok) mines.push({ ...r.data, pw }); else delPw(name, pw);
  }
  visitorView(name, data, mines);
}

function route(){
  const q = new URLSearchParams(location.search);
  let u = (q.get("u") || "").toLowerCase();
  const hk = new URLSearchParams(location.hash.slice(1)).get("k");
  if (q.has("new")) return homePage();
  if (u && hk){ saveKey(u, hk); history.replaceState(null, "", shareUrl(u)); }   // tautan pribadi: simpan kunci lalu bersihkan URL
  if (!u){ const me = LS.get("sk_me"); if (me && keys()[me]){ u = me; history.replaceState(null, "", shareUrl(u)); } }
  u ? threadPage(u) : homePage();
}
route();
